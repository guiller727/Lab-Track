<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabTrack · History</title>
<meta name="theme-color" content="#1f3da3">
<link rel="icon" href="/images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<script src="/common.js"></script>
</head>
<body>
<div class="layout">
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-header">
        <div>
          <h1>My borrowing history</h1>
          <p>Items you borrowed and returned successfully.</p>
        </div>
      </div>

      <p id="msg" class="msg" role="status"></p>

      <section class="card">
        <div class="toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input id="search" type="search" placeholder="Search by equipment name" aria-label="Search history">
          </div>
          <select id="filterCategory" aria-label="Filter by category"><option value="">All categories</option></select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Equipment</th><th>Category</th><th>Qty</th><th>Reason</th><th>Requested</th><th>Return by</th><th>Result</th></tr></thead>
            <tbody id="historyList"></tbody>
          </table>
        </div>
        <div class="pager" id="pager"></div>
      </section>
    </main>
  </div>
</div>
<script src="/history.js"></script>
</body>
</html>
