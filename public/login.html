<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabTrack · Log in</title>
<meta name="description" content="LabTrack: borrow and track laboratory equipment.">
<meta name="theme-color" content="#1f3da3">
<link rel="icon" href="/images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

<!-- Link preview (Facebook, Messenger, etc). server.js replaces __SITE__ with this website's address. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="LabTrack">
<meta property="og:title" content="LabTrack · Laboratory Equipment Management">
<meta property="og:description" content="Browse, request and track laboratory equipment.">
<meta property="og:url" content="__SITE__/">
<meta property="og:image" content="__SITE__/images/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="LabTrack · Laboratory Equipment Management">
<meta name="twitter:description" content="Browse, request and track laboratory equipment.">
<meta name="twitter:image" content="__SITE__/images/og-image.jpg">

<link rel="stylesheet" href="/style.css">
<script src="/common.js"></script>
</head>
<body class="auth-body">
<div class="auth-shell">

  <!-- Blue side panel: swaps its message between Sign in and Register -->
  <aside class="auth-panel">
    <div class="brand-row"><img class="brand-logo" src="/images/logo.webp" alt="University of Perpetual Help System logo"> LabTrack</div>
    <div>
      <div class="auth-panel-body" id="panelLogin">
        <h1>Hello, Student!</h1>
        <p>New to LabTrack? Create an account to start borrowing laboratory equipment.</p>
        <button type="button" class="btn-pill btn-pill-outline" id="toRegister">Register</button>
      </div>
      <div class="auth-panel-body" id="panelRegister" hidden>
        <h1>Welcome Back!</h1>
        <p>Already have an account? Sign in to continue.</p>
        <button type="button" class="btn-pill btn-pill-outline" id="toLogin">Sign In</button>
      </div>
    </div>
    <p class="auth-panel-foot">Laboratory Equipment Management</p>
  </aside>

  <section class="auth-box">
    <h2 class="auth-title" id="authTitle">Sign In to LabTrack</h2>
    <p class="auth-sub" id="authSub">Use your username and password</p>
    <p id="msg" class="msg" role="status"></p>

    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label for="loginUser" class="sr-only">Username</label>
        <div class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input id="loginUser" placeholder="Username" required autocomplete="username">
        </div>
      </div>
      <div class="form-group">
        <label for="loginPass" class="sr-only">Password</label>
        <div class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input id="loginPass" type="password" placeholder="Password" required autocomplete="current-password">
        </div>
      </div>
      <button class="btn-pill btn-pill-primary" type="submit">Log In</button>
    </form>

    <form id="registerForm" class="auth-form" hidden>
      <div class="form-group">
        <label for="regName" class="sr-only">Full name</label>
        <div class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input id="regName" placeholder="Full name" required maxlength="100">
        </div>
      </div>
      <div class="form-group">
        <label for="regUser" class="sr-only">Username</label>
        <div class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="12" r="2"/><path d="M14 10h4M14 14h4"/></svg>
          <input id="regUser" placeholder="Username" required maxlength="50" autocomplete="username">
        </div>
        <div class="field-error" id="regUserError"></div>
      </div>
      <div class="form-group">
        <label for="regPass" class="sr-only">Password</label>
        <div class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input id="regPass" type="password" placeholder="Password (6+ characters)" required minlength="6" autocomplete="new-password">
        </div>
      </div>
      <button class="btn-pill btn-pill-primary" type="submit">Sign Up</button>
    </form>
  </section>
</div>
<script src="/login.js"></script>
</body>
</html>
