<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabTrack · Requests</title>
<meta name="theme-color" content="#1f3da3">
<link rel="icon" href="/images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<script src="/common.js"></script>
</head>
<body>
<header id="header"></header>
<main>
  <section class="responsive">
    <h2 id="title">Requests</h2>
    <p class="hint" id="adminHint" hidden>Finished requests (returned, rejected, resolved) move to the Dashboard.</p>
    <p id="msg" class="msg" role="status"></p>
    <table>
      <thead><tr><th>Equipment</th><th>Qty</th><th>Requested by</th><th>Reason</th><th>Requested</th><th>Return by</th><th>Status</th><th id="actionHead"></th></tr></thead>
      <tbody id="reqList"></tbody>
    </table>
    <div class="pager" id="pager"></div>
  </section>
</main>
<script src="/requests.js"></script>
</body>
</html>
