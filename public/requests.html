<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabTrack · Requests</title>
<meta name="theme-color" content="#1f3da3">
<link rel="icon" href="/images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<script src="/common.js"></script>
</head>
<body>
<div class="layout">
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-header">
        <div>
          <h1 id="title">Requests</h1>
          <p id="hint"></p>
        </div>
      </div>

      <p id="msg" class="msg" role="status"></p>

      <section class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Equipment</th><th>Qty</th><th>Requested by</th><th>Reason</th><th>Requested</th><th>Return by</th><th>Status</th><th id="actionHead"></th></tr></thead>
            <tbody id="reqList"></tbody>
          </table>
        </div>
        <div class="pager" id="pager"></div>
      </section>
    </main>
  </div>
</div>
<script src="/requests.js"></script>
</body>
</html>
