<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabTrack · Equipment</title>
<meta name="theme-color" content="#1f3da3">
<link rel="icon" href="/images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<script src="/common.js"></script>
</head>
<body>
<div class="layout">
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-header">
        <div>
          <h1>Equipment</h1>
          <p id="pageHint">Browse the laboratory equipment.</p>
        </div>
        <button type="button" class="btn btn-primary" id="addBtn" hidden>+ Add equipment</button>
      </div>

      <p id="msg" class="msg" role="status"></p>

      <section class="card">
        <div class="toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input id="search" type="search" placeholder="Search by name" aria-label="Search by name">
          </div>
          <select id="filterCategory" aria-label="Filter by category"><option value="">All categories</option></select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Category</th><th>Location</th><th>Available</th><th>Condition</th><th>Status</th><th></th></tr></thead>
            <tbody id="equipList"></tbody>
          </table>
        </div>
        <div class="pager" id="pager"></div>
      </section>
    </main>
  </div>
</div>

<!-- Admin only: add / edit equipment (pop-up) -->
<dialog class="dlg" id="equipDialog">
  <form id="equipForm">
    <div class="dlg-head">
      <h3 id="formTitle">Add equipment</h3>
      <button type="button" class="dlg-close" data-close aria-label="Close">&times;</button>
    </div>
    <div class="dlg-body">
      <p id="equipMsg" class="msg" role="status"></p>
      <input type="hidden" id="equipId">
      <div class="form-grid">
        <label class="full">Name <input id="name" required maxlength="100"></label>
        <label>Category <input id="category" required maxlength="50" placeholder="e.g. Optics" list="categoryList"></label>
        <datalist id="categoryList"></datalist>
        <label>Location <input id="location" maxlength="100" placeholder="e.g. Lab 1"></label>
        <label>Total quantity <input id="total" type="number" min="0" inputmode="numeric" required></label>
        <label>Available quantity <input id="available" type="number" min="0" inputmode="numeric" required></label>
        <label class="full">Condition
          <select id="condition"><option>Good</option><option>Fair</option><option>Needs repair</option></select>
        </label>
      </div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn btn-outline" data-close>Cancel</button>
      <button type="submit" class="btn btn-primary" id="saveBtn">Add equipment</button>
    </div>
  </form>
</dialog>

<!-- Student only: send a borrow request (pop-up) -->
<dialog class="dlg" id="requestDialog">
  <form id="requestForm">
    <div class="dlg-head">
      <h3>Request equipment</h3>
      <button type="button" class="dlg-close" data-close aria-label="Close">&times;</button>
    </div>
    <div class="dlg-body">
      <p id="reqMsg" class="msg" role="status"></p>
      <input type="hidden" id="reqItemId">
      <div class="summary-box"><strong id="reqItemName"></strong><span id="reqItemInfo"></span></div>
      <div class="form-grid">
        <label class="full">Reason <textarea id="reqReason" rows="2" maxlength="255" required placeholder="e.g. Physics lab activity on Friday"></textarea></label>
        <label>Quantity <input id="reqQty" type="number" min="1" inputmode="numeric" required></label>
        <label>Needed until <input id="reqDate" type="date" required></label>
      </div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn btn-outline" data-close>Cancel</button>
      <button type="submit" class="btn btn-primary">Send request</button>
    </div>
  </form>
</dialog>

<script src="/equipment.js"></script>
</body>
</html>
